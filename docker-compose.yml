services:
  postgres:
    image: postgres:17-alpine
    container_name: cua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cua
      POSTGRES_PASSWORD: cua
      POSTGRES_DB: cua
    ports:
      # 5433 on the host so this never collides with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - cua-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cua -d cua"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cua-pgdata:
